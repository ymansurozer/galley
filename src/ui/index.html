<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Galley</title>
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg%20viewBox%3D%224%20-5%20120%20120%22%20fill%3D%22none%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%3E%3Cg%20filter%3D%22url(%23hb_f0)%22%3E%3Ccircle%20cx%3D%2254.0259%22%20cy%3D%2255.9741%22%20r%3D%2244.0259%22%20fill%3D%22%23EB5103%22%2F%3E%3C%2Fg%3E%3Cg%20filter%3D%22url(%23hb_f1)%22%3E%3Ccircle%20cx%3D%2272.6284%22%20cy%3D%2255.9741%22%20r%3D%2244.0259%22%20fill%3D%22%23EFCA44%22%2F%3E%3C%2Fg%3E%3Cg%20filter%3D%22url(%23hb_f2)%22%3E%3Ccircle%20cx%3D%2264.5923%22%20cy%3D%2254.0259%22%20r%3D%2244.0259%22%20fill%3D%22%23FAF6EA%22%2F%3E%3C%2Fg%3E%3Cdefs%3E%3Cfilter%20id%3D%22hb_f0%22%20x%3D%220.699%22%20y%3D%222.647%22%20width%3D%22106.654%22%20height%3D%22106.654%22%20filterUnits%3D%22userSpaceOnUse%22%20color-interpolation-filters%3D%22sRGB%22%3E%3CfeFlood%20flood-opacity%3D%220%22%20result%3D%22bg%22%2F%3E%3CfeBlend%20mode%3D%22normal%22%20in%3D%22SourceGraphic%22%20in2%3D%22bg%22%20result%3D%22shape%22%2F%3E%3CfeGaussianBlur%20stdDeviation%3D%224.6505%22%2F%3E%3C%2Ffilter%3E%3Cfilter%20id%3D%22hb_f1%22%20x%3D%2219.301%22%20y%3D%222.647%22%20width%3D%22106.654%22%20height%3D%22106.654%22%20filterUnits%3D%22userSpaceOnUse%22%20color-interpolation-filters%3D%22sRGB%22%3E%3CfeFlood%20flood-opacity%3D%220%22%20result%3D%22bg%22%2F%3E%3CfeBlend%20mode%3D%22normal%22%20in%3D%22SourceGraphic%22%20in2%3D%22bg%22%20result%3D%22shape%22%2F%3E%3CfeGaussianBlur%20stdDeviation%3D%224.6505%22%2F%3E%3C%2Ffilter%3E%3Cfilter%20id%3D%22hb_f2%22%20x%3D%2211.265%22%20y%3D%220.699%22%20width%3D%22106.654%22%20height%3D%22106.654%22%20filterUnits%3D%22userSpaceOnUse%22%20color-interpolation-filters%3D%22sRGB%22%3E%3CfeFlood%20flood-opacity%3D%220%22%20result%3D%22bg%22%2F%3E%3CfeBlend%20mode%3D%22normal%22%20in%3D%22SourceGraphic%22%20in2%3D%22bg%22%20result%3D%22shape%22%2F%3E%3CfeGaussianBlur%20stdDeviation%3D%224.6505%22%2F%3E%3C%2Ffilter%3E%3C%2Fdefs%3E%3C%2Fsvg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/ui.css">
</head>

<body>
  <div class="app booting" x-data :class="{booting: !$store.g.ready, 'view-ui': $store.g.view==='ui', 'ui-only': $store.g.uiOnly()}">
    <header class="top" :class="{done: $store.g.reviewDone}">
      <!-- What is under review: the branch (or file) and "project · mode" (topbar-derive.ts). The
           logo shows only where no sidebar carries the brand. -->
      <div class="top-title"><button class="nav-toggle" data-tip="Files" data-tip-keys="⇧B" aria-label="Toggle file tree"
          @click="$store.g.treeDrawerOpen = !$store.g.treeDrawerOpen"><svg class="ic" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2 4h12M2 8h12M2 12h12"/></svg></button><svg class="top-logo" aria-hidden="true" viewBox="4 -5 120 120" fill="none" xmlns="http://www.w3.org/2000/svg"><g filter="url(#tb_f0)"><circle cx="54.0259" cy="55.9741" r="44.0259" fill="#EB5103"/></g><g filter="url(#tb_f1)"><circle cx="72.6284" cy="55.9741" r="44.0259" fill="#EFCA44"/></g><g filter="url(#tb_f2)"><circle cx="64.5923" cy="54.0259" r="44.0259" fill="#FAF6EA"/></g><defs><filter id="tb_f0" x="0.699" y="2.647" width="106.654" height="106.654" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB"><feFlood flood-opacity="0" result="bg"/><feBlend mode="normal" in="SourceGraphic" in2="bg" result="shape"/><feGaussianBlur stdDeviation="4.6505"/></filter><filter id="tb_f1" x="19.301" y="2.647" width="106.654" height="106.654" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB"><feFlood flood-opacity="0" result="bg"/><feBlend mode="normal" in="SourceGraphic" in2="bg" result="shape"/><feGaussianBlur stdDeviation="4.6505"/></filter><filter id="tb_f2" x="11.265" y="0.699" width="106.654" height="106.654" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB"><feFlood flood-opacity="0" result="bg"/><feBlend mode="normal" in="SourceGraphic" in2="bg" result="shape"/><feGaussianBlur stdDeviation="4.6505"/></filter></defs></svg><div
          class="top-name"><div class="top-name-row"><b x-text="$store.g.deskTitle()" :title="$store.g.deskTitle()"></b><span
              class="top-tag" id="progressTag" role="status"></span></div><span
            x-text="$store.g.deskSubtitle()" :title="$store.g.deskSubtitle()"></span></div></div>
      <!-- The agent's presence (topbar-derive.ts): only while it has something in flight. -->
      <div class="agent-pill" role="status" x-cloak x-show="$store.g.presence.kind !== 'hidden'"
        :class="{queued: $store.g.presence.kind === 'notAttached'}" :data-tip="$store.g.presence.line"><svg
          class="agent-spin" viewBox="0 0 16 16" aria-hidden="true"><line x1="8" y1="1.6" x2="8" y2="4.6" opacity="0.18"/><line x1="8" y1="1.6" x2="8" y2="4.6" opacity="0.3" transform="rotate(45 8 8)"/><line x1="8" y1="1.6" x2="8" y2="4.6" opacity="0.41" transform="rotate(90 8 8)"/><line x1="8" y1="1.6" x2="8" y2="4.6" opacity="0.53" transform="rotate(135 8 8)"/><line x1="8" y1="1.6" x2="8" y2="4.6" opacity="0.64" transform="rotate(180 8 8)"/><line x1="8" y1="1.6" x2="8" y2="4.6" opacity="0.76" transform="rotate(225 8 8)"/><line x1="8" y1="1.6" x2="8" y2="4.6" opacity="0.87" transform="rotate(270 8 8)"/><line x1="8" y1="1.6" x2="8" y2="4.6" opacity="0.99" transform="rotate(315 8 8)"/></svg><i
          class="agent-off" aria-hidden="true"></i><b class="agent-who">Agent</b><span class="agent-line"
          x-text="$store.g.presence.line"></span><span class="agent-run" aria-hidden="true"><i></i></span></div>
      <div class="toggles">
        <!-- Code / UI lane switch: only when the desk has a UI target and a diff. A single-lane desk
             shows no lane label. -->
        <div class="seg lane-switch" x-cloak x-show="$store.g.hasUi() && !$store.g.uiOnly()" data-tip="Code / App" data-tip-keys="⇧U"><button
            :class="{active: $store.g.view==='code'}" @click="$store.g.setView('code')"><svg class="ic"><use href="#gly-code"></use></svg><span>Code</span></button><button
            :class="{active: $store.g.view==='ui'}" @click="$store.g.setView('ui')"><svg class="ic"><use href="#gly-app"></use></svg><span>App</span></button></div>
      </div>
      <div class="actions"><button class="btn icon top-settings" data-tip="Settings" data-tip-keys="⇧," @click="$store.g.openSettings()"><svg class="ic"><use href="#gly-settings"></use></svg></button><button
          class="btn quiet danger reset-review" data-tip="Reset review" data-tip-keys="⇧R" aria-label="Reset review" @click="$store.g.reset()"><svg class="ic"><use href="#gly-refresh"></use></svg><span>Reset review</span></button><span
          class="top-done">100%</span><button class="btn send-review" :class="{primary: $store.g.reviewDone && !$store.g.awaitingAgent}"
          :disabled="$store.g.awaitingAgent" @click="$store.g.confirmSend()"><svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3.5 8.5 3 3 6-7"/></svg><span
            x-text="$store.g.awaitingAgent ? 'Waiting for Agent…' : 'Send Review'">Send Review</span> <kbd x-keys>⇧S</kbd></button></div>
      <!-- Review progress along the bar's bottom edge (progress.ts): the fill, and the ⇧A tail ahead
           of it. -->
      <div class="top-progress" id="progressStrip" style="display:none"><i class="fill" id="progressFill"></i><i
          class="tail" id="progressTail"></i></div>
    </header>
    <main class="main">
      <aside class="tree" :class="{'drawer-open': $store.g.treeDrawerOpen}">
        <div class="side-brand"><svg class="side-logo" aria-hidden="true" viewBox="4 -5 120 120" fill="none" xmlns="http://www.w3.org/2000/svg"><g filter="url(#side_f0)"><circle cx="54.0259" cy="55.9741" r="44.0259" fill="#EB5103"/></g><g filter="url(#side_f1)"><circle cx="72.6284" cy="55.9741" r="44.0259" fill="#EFCA44"/></g><g filter="url(#side_f2)"><circle cx="64.5923" cy="54.0259" r="44.0259" fill="#FAF6EA"/></g><defs><filter id="side_f0" x="0.699" y="2.647" width="106.654" height="106.654" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB"><feFlood flood-opacity="0" result="bg"/><feBlend mode="normal" in="SourceGraphic" in2="bg" result="shape"/><feGaussianBlur stdDeviation="4.6505"/></filter><filter id="side_f1" x="19.301" y="2.647" width="106.654" height="106.654" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB"><feFlood flood-opacity="0" result="bg"/><feBlend mode="normal" in="SourceGraphic" in2="bg" result="shape"/><feGaussianBlur stdDeviation="4.6505"/></filter><filter id="side_f2" x="11.265" y="0.699" width="106.654" height="106.654" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB"><feFlood flood-opacity="0" result="bg"/><feBlend mode="normal" in="SourceGraphic" in2="bg" result="shape"/><feGaussianBlur stdDeviation="4.6505"/></filter></defs></svg><span>Galley</span></div>
        <div class="side-switch seg xs" x-show="$store.g.hasGuide && $store.g.hasGuide()" x-cloak>
          <!-- The w hint sits on the INACTIVE tab — the one pressing w switches to. -->
          <button :class="{active: $store.g.sidebarTab==='walkthrough'}" @click="$store.g.setSidebarTab('walkthrough')">Review <kbd x-keys x-show="$store.g.sidebarTab==='tree'">w</kbd></button>
          <button :class="{active: $store.g.sidebarTab==='tree'}" @click="$store.g.setSidebarTab('tree')">Files <kbd x-keys x-show="$store.g.sidebarTab!=='tree'">w</kbd></button>
        </div>
        <!-- Above either list: the Overview (Review tab) and the open change requests (both tabs, and a
             guide-less desk). -->
        <div class="side-nav">
          <!-- "active" while the Overview shows, patched like the file rows' (applyActiveRow). -->
          <div class="node overview-row" data-key="overview" x-show="$store.g.hasGuide && $store.g.hasGuide() && $store.g.sidebarTab==='walkthrough'"
            @click="$store.g.openOverview()"><svg class="ic"><use href="#gly-home"></use></svg><span class="nm">Overview</span><kbd x-keys>o</kbd></div>
          <div class="node cr-head" x-show="$store.g.requestRows().length" x-cloak role="button" :aria-expanded="$store.g.requestsOpen"
            @click="$store.g.requestsOpen = !$store.g.requestsOpen"><svg class="ic flag"><use href="#gly-flag"></use></svg><span
              class="nm">Change requests</span><svg class="ic chev" :class="{open: $store.g.requestsOpen}"><use href="#gly-chevron"></use></svg><span
              class="cr-count" x-text="$store.g.requestRows().length"></span><kbd x-keys>]</kbd></div>
          <div class="cr-list" x-show="$store.g.requestsOpen && $store.g.requestRows().length" x-cloak>
            <template x-for="r in $store.g.requestRows()" :key="r.key">
              <div class="node cr-row" :class="{app: r.kind==='app'}" :title="r.loc + ' — ' + r.text" @click="$store.g.openRequest(r)">
                <svg class="ic" x-show="r.kind==='code'"><use href="#gly-flag"></use></svg>
                <svg class="ic" x-show="r.kind==='app'"><use href="#gly-app"></use></svg>
                <span class="cr-loc" x-text="r.loc"></span>
                <span class="nm" x-text="r.text"></span>
              </div>
            </template>
          </div>
        </div>
        <div class="tree-title" x-show="!($store.g.hasGuide && $store.g.hasGuide()) || $store.g.sidebarTab==='tree'"><span>Files</span>
          <button class="tree-toggle" @click="$store.g.toggleAllDirs()"
            :aria-label="$store.g.treeAnyOpen && $store.g.treeAnyOpen() ? 'Collapse all' : 'Expand all'"
            :data-tip="$store.g.treeAnyOpen && $store.g.treeAnyOpen() ? 'Collapse all' : 'Expand all'">
            <svg class="ic" x-show="$store.g.treeAnyOpen && $store.g.treeAnyOpen()"><use href="#gly-collapse-all"></use></svg>
            <svg class="ic" x-show="!($store.g.treeAnyOpen && $store.g.treeAnyOpen())"><use href="#gly-expand-all"></use></svg>
          </button>
        </div>
        <div id="files" x-show="!($store.g.hasGuide && $store.g.hasGuide()) || $store.g.sidebarTab==='tree'"><template x-for="r in $store.g.treeRows()" :key="r.key">
            <div class="node" :data-key="r.key" :class="[r.cls, r.kind==='skimgrp' ? 'skimgrp' : '']" :style="r.style" @click="$store.g.rowClick(r)">
              <svg class="ic chev" :class="{open: r.open}" x-show="r.kind==='dir' || r.kind==='skimgrp'"><use href="#gly-chevron"></use></svg>
              <svg class="ic folder" x-show="r.kind==='dir'"><use href="#gly-folder"></use></svg>
              <span class="chev-spacer" x-show="r.kind==='file' || r.kind==='test'"></span>
              <svg class="ic file" :class="r.changeType" x-show="r.kind==='file' || r.kind==='test'"><use href="#gly-file"></use></svg>
              <span class="nm" x-show="r.kind!=='skimgrp'" x-text="r.name"></span>
              <span class="moved-from" x-show="r.movedFrom" x-text="'← '+r.movedFrom" :title="'moved from '+r.movedFrom"></span>
              <span class="nm skimgrp-name" x-show="r.kind==='skimgrp'">Skimmed</span>
              <span class="skimgrp-count" x-show="r.kind==='skimgrp'" x-text="r.count + (r.count===1 ? ' file' : ' files')"></span>
              <svg class="ic skim" x-show="(r.kind==='file' || r.kind==='test') && r.skim" title="Skimmed"><use href="#gly-collapse-all"></use></svg>
              <span class="testcaret" x-show="r.testToggle" @click.stop="$store.g.toggleTestDir(r.testKey)">
                <svg class="ic chev" :class="{open: r.testCaret==='▾'}"><use href="#gly-chevron"></use></svg></span>
              <span class="status-pack" x-show="r.state">
                <!-- mousedown.prevent: a click doesn't leave focus here, where Space would click it again. -->
                <button type="button" class="st-btn" @click.stop="$store.g.statusClick(r.path, $event)" @mousedown.prevent
                  @mouseenter="$store.g.statusHint($el, r.path)" @focus="$store.g.statusHint($el, r.path)">
                  <svg class="ic badge pending" x-show="r.state==='pending'"><use href="#gly-dot"></use></svg>
                  <svg class="ic badge approved" x-show="r.state==='approved'"><use href="#gly-check"></use></svg>
                  <svg class="ic badge changes" x-show="r.state==='changes-requested'"><use href="#gly-flag"></use></svg>
                </button>
              </span>
            </div>
          </template></div>
        <div id="walk" x-show="$store.g.hasGuide && $store.g.hasGuide() && $store.g.sidebarTab==='walkthrough'" x-cloak>
          <template x-for="r in $store.g.walkthroughRows()" :key="r.key">
            <div class="node" :data-key="r.key" :class="[r.kind==='cat' ? 'walk-cat' : r.cls, r.kind==='cat' && r.skimmed ? 'walk-skim' : '', r.kind==='file' && r.flag ? 'flagged' : '']"
              @click="r.kind!=='cat' ? $store.g.selectFile(r.fileIndex) : (r.skimmed ? $store.g.toggleSkimGroup() : $store.g.selectFile(r.jumpIndex))">
              <svg class="ic chev" :class="{open: r.open}" x-show="r.kind==='cat' && r.skimmed"><use href="#gly-chevron"></use></svg>
              <span class="nm walk-cat-name" x-show="r.kind==='cat'" x-text="r.category" :title="r.category"></span>
              <span class="walk-skim-count" x-show="r.kind==='cat' && r.skimmed" x-text="r.total + (r.total===1 ? ' file' : ' files')"></span>
              <span class="nm" x-show="r.kind==='file'" x-text="r.name" :title="r.path"></span>
              <span class="moved-from" x-show="r.kind==='file' && r.movedFrom" x-text="'← '+r.movedFrom" :title="'moved from '+r.movedFrom"></span>
              <svg class="ic crit" x-show="r.kind==='file' && r.flag" :title="r.flag"><use href="#gly-flag"></use></svg>
              <svg class="ic skim" x-show="r.kind==='file' && r.skim" title="Skimmed"><use href="#gly-collapse-all"></use></svg>
              <!-- Hidden on cat rows: an empty status-pack still carries margin-left:auto, and two
                   auto margins would split the free space and strand the skim-group count mid-row. -->
              <span class="status-pack" x-show="r.kind==='file'">
                <i class="add" x-show="r.kind==='file' && r.added" x-text="'+'+r.added"></i>
                <i class="del" x-show="r.kind==='file' && r.removed" x-text="'−'+r.removed"></i>
                <!-- The file's status closes the row (empty circle = to do). A click signs the file off
                     or resets it, as in the Files tab. -->
                <button type="button" class="st-btn" x-show="r.kind==='file' && r.state" @click.stop="$store.g.statusClick(r.path, $event)" @mousedown.prevent
                  @mouseenter="$store.g.statusHint($el, r.path)" @focus="$store.g.statusHint($el, r.path)">
                  <svg class="ic st pending" x-show="r.state==='pending'"><use href="#gly-circle"></use></svg>
                  <svg class="ic st approved" x-show="r.state==='approved'"><use href="#gly-check"></use></svg>
                  <svg class="ic st changes" x-show="r.state==='changes-requested'"><use href="#gly-circle-alert"></use></svg>
                </button>
              </span>
            </div>
          </template>
        </div>
        <div class="side-foot"><button class="tree-settings" @click="$store.g.openSettings()"><svg class="ic"><use href="#gly-settings"></use></svg><span>Settings</span><kbd x-keys>⇧,</kbd></button></div>
      </aside>
      <!-- Narrow-width only (CSS-gated): dims the diff behind the open file drawer; tap to close. -->
      <div class="tree-backdrop" :class="{open: $store.g.treeDrawerOpen}" @click="$store.g.treeDrawerOpen=false"></div>
      <div class="resizer" data-resize="left"></div>
      <section class="center">
        <div class="diff-area">
          <div id="diff" x-ignore></div>
          <div class="ovr" id="ovr" x-ignore></div>
          <div class="diff-rendering" x-show="$store.g.rendering" x-cloak><span>Rendering…</span></div>
        </div>
        <!-- The UI view: the proxied app under a browser-chrome bar. The
             iframe is created by appview.ts inside #appFrame and stays alive across view switches;
             the code view keeps it laid out, unseen and inert, once it has loaded. -->
        <div class="uiview" x-cloak x-show="$store.g.view==='ui' || $store.g.app.loaded" :inert="$store.g.view!=='ui'">
          <div class="chrome">
            <div class="grp">
              <button class="sq" data-tip="Back" aria-label="Back" @click="$store.g.appBack()"
                :disabled="!$store.g.app.connected || $store.g.app.canGoBack===false"><svg class="ic"><use href="#gly-arrow-left"></use></svg></button>
              <button class="sq" data-tip="Forward" aria-label="Forward" @click="$store.g.appForward()"
                :disabled="!$store.g.app.connected || $store.g.app.canGoForward===false"><svg class="ic"><use href="#gly-arrow-right"></use></svg></button>
              <button class="sq" data-tip="Refresh app" aria-label="Refresh app" @click="$store.g.appRefresh()"><svg class="ic"><use href="#gly-refresh"></use></svg></button>
            </div>
            <form class="addr" @submit.prevent="$store.g.appGo($refs.addr.value); $refs.addr.blur()" :title="$store.g.app.title">
              <span class="host" x-text="$store.g.appHost()"></span>
              <input x-ref="addr" :value="$store.g.app.route" spellcheck="false" autocomplete="off" aria-label="App route"
                @keydown.escape="$event.target.value = $store.g.app.route; $event.target.blur()">
              <!-- The page's own annotations: their pins live here, not on the page. -->
              <span class="pagepins"><template x-for="m in $store.g.pagePins()" :key="m.id"><button type="button"
                    class="pagepin" :class="{q: m.question, sel: m.selected, resolved: m.resolved}" :data-id="m.id" :title="'#' + m.number + ' · this page'"
                    @click="$store.g.selectAnnotation(m.selected ? null : m.id)" x-text="m.number"></button></template></span>
            </form>
            <button class="pill-refresh" x-cloak x-show="$store.g.app.stale" @click="$store.g.appRefresh()"><span class="dot"></span>App updated — refresh</button>
            <div class="seg" role="group" aria-label="Viewport">
              <button data-tip="Desktop 1440" aria-label="Desktop 1440" :class="{active: $store.g.viewport==='desktop'}" @click="$store.g.setViewport('desktop')"><svg class="ic"><use href="#gly-desktop"></use></svg></button>
              <button data-tip="Tablet 820" aria-label="Tablet 820" :class="{active: $store.g.viewport==='tablet'}" @click="$store.g.setViewport('tablet')"><svg class="ic"><use href="#gly-tablet"></use></svg></button>
              <button data-tip="Mobile 390" aria-label="Mobile 390" :class="{active: $store.g.viewport==='mobile'}" @click="$store.g.setViewport('mobile')"><svg class="ic"><use href="#gly-mobile"></use></svg></button>
              <button data-tip="Fit to pane" data-tip-align="end" aria-label="Fit to pane" :class="{active: $store.g.viewport==='fit'}" @click="$store.g.setViewport('fit')"><svg class="ic"><use href="#gly-fit"></use></svg></button>
            </div>
            <span class="vpsize" x-text="$store.g.frameLabel"></span>
            <button class="sq" data-tip="Annotate this page" data-tip-keys="⌥P" data-tip-align="end" aria-label="Annotate this page"
              :disabled="!$store.g.app.connected" @click="$store.g.annotatePage()"><svg class="ic"><use href="#gly-page-note"></use></svg></button>
            <div class="mode seg" role="group" aria-label="Mode" data-tip="Interact / Annotate" data-tip-keys="⌥A" data-tip-align="end">
              <button :class="{active: $store.g.appMode==='interact'}" @click="$store.g.setAppMode('interact')"><svg class="ic"><use href="#gly-pointer"></use></svg><span>Interact</span></button><button
                class="ann" :class="{active: $store.g.appMode==='annotate'}" @click="$store.g.setAppMode('annotate')"><svg class="ic"><use href="#gly-annotate"></use></svg><span>Annotate</span><kbd x-keys>⌥A</kbd></button>
            </div>
          </div>
          <div class="stage" id="appStage" :class="[$store.g.viewport==='fit' ? '' : 'preset ' + $store.g.viewport, $store.g.appMode==='annotate' ? 'annotate' : '']">
            <div class="frame" id="appFrame" x-ignore></div>
            <!-- This page's annotations whose target couldn't be found on it: pins in a tray, each opening
                 its card. -->
            <div class="unplaced-tray" x-cloak x-show="$store.g.view==='ui' && $store.g.unplacedPins().length"
              aria-label="Unplaced annotations"><span>Unplaced</span><template x-for="m in $store.g.unplacedPins()" :key="m.id"><button
                  type="button" class="traypin" :class="{q: m.question, sel: m.selected, resolved: m.resolved}" :data-id="m.id"
                  :title="'#' + m.number + ' · not found on this page'" @click="$store.g.selectAnnotation(m.selected ? null : m.id)"
                  x-text="m.number"></button></template></div>
            <div class="stage-note" x-show="!$store.g.uiProxy">Starting the app proxy…</div>
            <div class="mode-hint" x-cloak x-show="$store.g.appMode==='annotate'"><b>Annotate</b><span
                class="tip"><kbd x-keys>Click</kbd>element</span><span
                class="tip t-add"><kbd x-keys>⇧ Click</kbd>select several</span><span
                class="tip t-region"><kbd x-keys>Drag</kbd>region</span><span
                class="tip t-quote"><kbd x-keys>Drag text</kbd>quote</span><span
                class="tip t-page"><kbd x-keys>⌥P</kbd>page</span><button
                class="tip" @click="$store.g.setAppMode('interact')"><kbd x-keys>Esc</kbd>interact</button></div>
          </div>
        </div>
      </section>
      <!-- The floating composer on an element picked in Annotate mode, and the selected annotation's
           card beside its pin (uilane.ts): bottom sheets at narrow widths. -->
      <div class="ucomposer" id="uiComposer" x-ignore></div>
      <div class="ucomposer" id="pinCard" tabindex="-1" x-ignore></div>
      <div class="modal-backdrop" id="settingsModal" :class="{show: $store.g.settingsOpen}"
        @click.self="$store.g.closeSettings()">
        <div class="modal settings">
          <div class="set-tabs seg">
            <button :class="{active: $store.g.settingsTab==='settings'}" @click="$store.g.settingsTab='settings'">Settings</button>
            <button :class="{active: $store.g.settingsTab==='shortcuts'}" @click="$store.g.settingsTab='shortcuts'">Shortcuts</button>
          </div>
          <div class="set-pane" x-show="$store.g.settingsTab==='settings'">
          <div class="set-section">Diff</div>
          <div class="set-grid"><label>Layout<select :value="$store.g.diffStyle"
                @change="$store.g.setStyle($event.target.value)">
                <option value="split">Split</option>
                <option value="unified">Unified</option>
              </select></label><label>Intra-line<select x-model="$store.g.settings.lineDiffType"
                @change="$store.g.applySettings()">
                <option value="word-alt">Word</option>
                <option value="char">Character</option>
                <option value="none">None</option>
              </select></label><label>Change indicators<select x-model="$store.g.settings.diffIndicators"
                @change="$store.g.applySettings()">
                <option value="bars">Bars</option>
                <option value="classic">Classic</option>
                <option value="none">None</option>
              </select></label><label>Hunk separators<select x-model="$store.g.settings.hunkSeparators"
                @change="$store.g.applySettings()">
                <option value="line-info">Line info</option>
                <option value="simple">Simple</option>
                <option value="metadata">Metadata</option>
              </select></label><label>Line wrapping<select x-model="$store.g.settings.overflow"
                @change="$store.g.applySettings()">
                <option value="scroll">Scroll</option>
                <option value="wrap">Wrap</option>
              </select></label><label>Line highlight<select x-model="$store.g.settings.lineHighlight"
                @change="$store.g.applySettings()">
                <option value="full">Full</option>
                <option value="subtle">Subtle</option>
                <option value="off">Off (word only)</option>
              </select></label><label>Unchanged lines<select x-model="$store.g.settings.unchangedLines"
                @change="$store.g.applySettings()">
                <option value="collapse">Collapse</option>
                <option value="expand">Expand all</option>
              </select></label></div>
          <div class="set-section">Appearance</div>
          <div class="set-grid"><label>Theme<select x-model="$store.g.settings.appearance"
                @change="$store.g.applySettings()">
                <option value="dark">Dark</option>
                <option value="light">Light</option>
              </select></label><label>Code theme<select x-model="$store.g.settings.theme"
                @change="$store.g.applySettings()">
                <optgroup label="Dark">
                  <option value="material-theme-palenight">Palenight</option>
                  <option value="material-theme-darker">Material Darker</option>
                  <option value="github-dark">GitHub Dark</option>
                  <option value="dracula">Dracula</option>
                  <option value="ayu-dark">Ayu Dark</option>
                  <option value="gruvbox-dark-medium">Gruvbox</option>
                  <option value="everforest-dark">Everforest</option>
                  <option value="dark-plus">Dark+ (VS Code)</option>
                </optgroup>
                <optgroup label="Light">
                  <option value="github-light">GitHub Light</option>
                  <option value="one-light">One Light</option>
                  <option value="vitesse-light">Vitesse Light</option>
                  <option value="catppuccin-latte">Catppuccin Latte</option>
                  <option value="everforest-light">Everforest Light</option>
                  <option value="light-plus">Light+ (VS Code)</option>
                </optgroup>
                <optgroup label="Diff only">
                  <option value="pierre-dark">Pierre Dark</option>
                  <option value="pierre-dark-soft">Pierre Dark Soft</option>
                  <option value="pierre-light">Pierre Light</option>
                </optgroup>
              </select></label><label>Code font<select x-model="$store.g.settings.font" @change="$store.g.applySettings()">
                <option value="jetbrains-mono">JetBrains Mono</option>
                <option value="geist-mono">Geist Mono</option>
                <option value="fira-code">Fira Code</option>
                <option value="ibm-plex-mono">IBM Plex Mono</option>
                <option value="source-code-pro">Source Code Pro</option>
                <option value="roboto-mono">Roboto Mono</option>
              </select></label><label>UI font<select x-model="$store.g.settings.uiFont" @change="$store.g.applySettings()">
                <option value="inter">Inter</option>
                <option value="geist">Geist</option>
                <option value="ibm-plex-sans">IBM Plex Sans</option>
                <option value="system">System</option>
              </select></label><label>Code size<input type="number" min="11" max="16" step="0.5"
                x-model.number="$store.g.settings.fontSize" @change="$store.g.applySettings()"></label><label>Tab size<select
                x-model.number="$store.g.settings.tabSize" @change="$store.g.applySettings()">
                <option value="2">2</option>
                <option value="4">4</option>
                <option value="8">8</option>
              </select></label></div>
          <div class="set-section">File tree</div>
          <div class="set-grid"><label>Unchanged files<select
                @change="$store.g.settings.showUnchanged = $event.target.value === 'show'; $store.g.applySettings()">
                <option value="show" :selected="$store.g.settings.showUnchanged">Show</option>
                <option value="hide" :selected="!$store.g.settings.showUnchanged">Hide</option>
              </select></label><label>Guided sidebar opens<select x-model="$store.g.settings.sidebarDefault"
                @change="$store.g.applySettings()">
                <option value="walkthrough">Review</option>
                <option value="tree">Files</option>
              </select></label></div>
          <div class="set-section">Behavior</div>
          <div class="set-grid"><label>Track progress by<select x-model="$store.g.settings.progressBy"
                @change="$store.g.applySettings()">
                <option value="lines">Diff lines</option>
                <option value="files">Files</option>
              </select></label><label>Markdown files<select x-model="$store.g.settings.markdownView"
                @change="$store.g.applySettings()">
                <option value="auto">Auto</option>
                <option value="rendered">Rendered</option>
                <option value="source">Source</option>
              </select></label><label>Per-change verdicts<select
                @change="$store.g.settings.perChangeVerdicts = $event.target.value === 'on'; $store.g.applySettings()">
                <option value="on" :selected="$store.g.settings.perChangeVerdicts">On</option>
                <option value="off" :selected="!$store.g.settings.perChangeVerdicts">Off</option>
              </select></label><label>Approve<select
                @change="$store.g.settings.stageOnAccept = $event.target.value === 'stage'; $store.g.applySettings()">
                <option value="stage" :selected="$store.g.settings.stageOnAccept">Stages file</option>
                <option value="verdict" :selected="!$store.g.settings.stageOnAccept">Verdict only</option>
              </select></label><label>Editor command<input type="text" placeholder="code -g {file}:{line}"
                x-model="$store.g.settings.editorCommand" @change="$store.g.applySettings()"></label></div>
          </div>
          <div class="set-pane" x-show="$store.g.settingsTab==='shortcuts'" x-cloak>
            <template x-for="grp in $store.g.helpGroups()" :key="grp.group">
              <div class="help-col">
                <div class="help-h" x-text="grp.group"></div>
                <template x-for="it in grp.items" :key="it.combo">
                  <div class="help-row"><span x-text="it.desc"></span><kbd x-keys="it.combo"></kbd></div>
                </template>
              </div>
            </template>
          </div>
          <div class="modal-actions"><button class="btn primary" @click="$store.g.closeSettings()">Done</button></div>
        </div>
      </div>
      <div class="modal-backdrop" id="confirmModal" :class="{show: $store.g.confirmMsg}" @click.self="$store.g.confirmNo()">
        <div class="modal confirm">
          <p x-text="$store.g.confirmMsg"></p>
          <div class="modal-actions"><button class="btn" @click="$store.g.confirmNo()">Cancel <kbd x-keys>Esc</kbd></button><button
              class="btn primary" @click="$store.g.confirmYes()">Confirm <kbd x-keys>↵</kbd></button></div>
        </div>
      </div>
      <div class="modal-backdrop" id="sendModal" :class="{show: $store.g.sendOpen}" @click.self="$store.g.sendCancel()">
        <div class="modal send">
          <p x-text="$store.g.sendMsg"></p>
          <div class="lanes" x-show="$store.g.sendLanes">
            <div class="lane" x-show="$store.g.sendLanes?.code"><b>Code</b><div x-text="$store.g.sendLanes?.code"></div></div>
            <div class="lane"><b>UI</b><div><span x-text="$store.g.sendLanes?.ui"></span><div class="sub"
                  x-show="$store.g.sendLanes?.uiNotSent" x-text="$store.g.sendLanes?.uiNotSent"></div></div></div>
          </div>
          <textarea id="sendNote" x-model="$store.g.sendNote"
            placeholder="Overall note (optional) — an overall remark, or what to do after applying"></textarea>
          <div class="modal-actions"><button class="btn" @click="$store.g.sendCancel()">Cancel <kbd x-keys>Esc</kbd></button><button
              class="btn primary" :disabled="$store.g.sendFinishing" @click="$store.g.sendConfirm()"><span
                x-text="$store.g.sendFinishing ? 'Finishing screenshots…' : 'Send'">Send</span> <kbd x-keys>⌘↵</kbd></button></div>
        </div>
      </div>
      <!-- An annotation's screenshot, enlarged from its row's context line (uilane.ts): the crop or
           the whole viewport, as the bridge rendered them with the mark drawn on. -->
      <div class="modal-backdrop" id="shotModal" :class="{show: $store.g.shotView}" @click.self="$store.g.closeShot()">
        <div class="modal shot" role="dialog" :aria-label="$store.g.shotTitle()">
          <h3><span x-text="$store.g.shotTitle()"></span><span class="seg" role="group" aria-label="Image"><button
                :class="{active: $store.g.shotView?.kind==='crop'}" @click="$store.g.shotView.kind='crop'">Crop</button><button
                :class="{active: $store.g.shotView?.kind==='viewport'}" @click="$store.g.shotView.kind='viewport'">Viewport</button></span></h3>
          <div class="shot-frame"><template x-if="$store.g.shotView"><img :src="$store.g.shotSrc()" :alt="$store.g.shotTitle()"></template></div>
          <div class="modal-actions"><button class="btn" @click="$store.g.closeShot()">Close <kbd x-keys>Esc</kbd></button></div>
        </div>
      </div>
      <div class="toast" id="toast" :class="{show: $store.g.toastMsg}"><span x-text="$store.g.toastMsg">saved</span><kbd x-keys="$store.g.toastKeys" x-show="$store.g.toastKeys"></kbd><button
          type="button" class="toast-action" x-show="$store.g.toastAction" x-text="$store.g.toastAction"
          @click="$store.g.runToastAction()"></button></div>
      <div class="goline" :class="{show: $store.g.golineBuffer}">Go to line&nbsp;<b
          x-text="$store.g.golineBuffer"></b><span class="goline-hint"><kbd x-keys>↵</kbd> Jump · <kbd x-keys>Esc</kbd>
          Cancel</span></div>
    </main>
  </div>
  <script type="module" src="/ui.js"></script>
</body>

</html>
