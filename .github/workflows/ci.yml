name: ci

on:
  push:
    branches: [main]
  # Any base, so slice and PRD branches get CI; push stays main-only so a PR's branch isn't run twice.
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: corepack enable
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm build
      - run: pnpm test
      - run: pnpm smoke
      - run: pnpm perf-smoke
